[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glitchlock"
version = "1.0.0"
description = "Reversible, keyed bitstream scrambling for video, built on FFglitch"
readme = "README.md"
authors = [{ name = "Sasha Zero", email = "sasha@ripostelabs.xyz" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ffglitch", "datamosh", "glitch", "video", "bitstream", "reversible"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Topic :: Artistic Software",
]
dependencies = []

[project.optional-dependencies]
# Public-key recipients. The core scrambler stays stdlib-only.
recipients = ["cryptography>=41"]

[project.scripts]
glitchlock = "glitchlock.cli:main"

[project.urls]
Homepage = "https://github.com/armeehn/glitchlock"
Issues = "https://github.com/armeehn/glitchlock/issues"
Changelog = "https://github.com/armeehn/glitchlock/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
